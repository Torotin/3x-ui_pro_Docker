services:
  usque:
    image: ${USQUE_IMAGE:-torotin/usque:latest}
    container_name: usque
    restart: unless-stopped
    working_dir: /app
    command: ["socks"]
    environment:
      TZ: ${TZ:-UTC}
    # ports:
      # # SOCKS5 proxy
      # "${USQUE_PORT:-1080}:1080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --socks5-hostname 127.0.0.1:${USQUE_PORT_INTERNAL:-1080} -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -q 'warp=on'"
        ]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      traefik-proxy:
        ipv4_address: 172.18.0.9