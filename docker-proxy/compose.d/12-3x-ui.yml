services:
  sub-json-processor:
    image: python:3.12-alpine
    container_name: sub-json-processor
    restart: unless-stopped
    depends_on:
      3x-ui:
        condition: service_healthy
    networks:
      - traefik-proxy
      - dns-net
    volumes:
      - ../3x-ui/sub-json-processor:/app:ro
    env_file:
      - ./.env
      - ../3x-ui/3x-ui.env
    environment:
      - SUB_JSON_PROCESSOR_PORT=8080
      - SUB_JSON_GEODATA_ENABLE=true
      - SUB_JSON_GEODATA_CRON=0 4 * * *
      - SUB_JSON_GEODATA_OUTBOUND=proxy
      - SUB_JSON_GEODATA_ASSETS_JSON=
      - SUB_JSON_PROCESSOR_FAIL_OPEN=true
    command: ["python", "/app/server.py"]
    security_opt:
      - no-new-privileges=true
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os, urllib.request; urllib.request.urlopen(\"http://127.0.0.1:%s/healthz\" % os.environ.get(\"SUB_JSON_PROCESSOR_PORT\", \"8080\"), timeout=3).read()'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.tags=traefik
      - traefik.http.services.sub-json-processor-svc.loadbalancer.server.port=${SUB_JSON_PROCESSOR_PORT:-8080}
      - traefik.http.routers.sub-json-processor.rule=Host(`${WEBDOMAIN}`) && PathPrefix(`${URI_JSON_PATH}`)
      - traefik.http.routers.sub-json-processor.entrypoints=websecure
      - traefik.http.routers.sub-json-processor.middlewares=bouncer@file,3xui-sub-chain
      - traefik.http.routers.sub-json-processor.tls.certresolver=le
      - traefik.http.routers.sub-json-processor.service=sub-json-processor-svc
      - traefik.http.routers.sub-json-processor.priority=10000

  3x-ui:
    image: torotin/3x-ui:latest
    container_name: 3x-ui
    hostname: ${WEBDOMAIN}
    restart: always
    depends_on:
      warp:
        condition: service_healthy
      adguard:
        condition: service_healthy
      tor-proxy:
        condition: service_healthy
    tty: true
    security_opt:
      - no-new-privileges=true
    networks:
      traefik-proxy:
        ipv4_address: 172.18.0.12
      dns-net:
        ipv4_address: 172.19.0.12
    dns:
      - 172.19.0.10
    volumes:
      - ../3x-ui/scripts/lib:/mnt/sh/lib:rw
      - ../3x-ui/scripts/00_BeforeStart:/mnt/sh/beforestart:rw
      - ../3x-ui/scripts/01_AfterStart:/mnt/sh/afterstart:rw
      - ../3x-ui/configs/x-ui.db:/etc/x-ui/x-ui.db:rw
      - ../3x-ui/configs/config.json:/app/bin/config.json:rw
      - ../_logs/xray/access.log:/app/access.log
      - ../_logs/xray/error.log:/app/error.log
      - ../_logs:/var/log:rw
    env_file:
      - ./.env
      - ../3x-ui/3x-ui.env
    environment:
      # - XUI_LOG_LEVEL=debug
      - XUI_LOG_FOLDER=/var/log/3x-ui
    device_cgroup_rules:
      - 'c 10:200 rwm'
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    healthcheck:
      # 1) проверяем, что панель жива по admin-порту (PORT_LOCAL_VLESS_PANEL или 2053 по умолчанию)
      # 2) если панель отключена, хотя бы убедимся, что процесс жив (pgrep)
      test: ["CMD-SHELL", "curl -fsS 127.0.0.1:$PORT_LOCAL_VLESS_PANEL/$URI_PANEL_PATH/ >/dev/null || nc -z 127.0.0.1 ${PORT_LOCAL_VISION} || pgrep -f 'x-ui|xray|sing-box' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.tags=traefik

      # ---------- Сервисы ----------
      # Панель управления 3XUI
      - traefik.http.services.3xui-panel-svc.loadbalancer.server.port=${PORT_LOCAL_VLESS_PANEL}
      - traefik.http.services.3xui-panel-svc.loadbalancer.healthcheck.path=/${URI_PANEL_PATH}/
      - traefik.http.services.3xui-panel-svc.loadbalancer.healthcheck.interval=30s
      - traefik.http.services.3xui-panel-svc.loadbalancer.healthcheck.timeout=5s

      # Подписки
      - traefik.http.services.3xui-sub-svc.loadbalancer.server.port=${PORT_LOCAL_VLESS_SUBSCRIBE}

      # XHTTP
      - traefik.http.services.xhttp3xui-svc.loadbalancer.server.port=${PORT_LOCAL_XHTTP}

      # ---------- Middleware ----------
      # Сжатие
      - traefik.http.middlewares.3xui-compress.compress=true

      # Лимитирование запросов
      - traefik.http.middlewares.3xui-rate-limit.ratelimit.average=50
      - traefik.http.middlewares.3xui-rate-limit.ratelimit.burst=100
      # Basic Auth
      - traefik.http.middlewares.3xui-basic-auth.basicauth.users=${HT_PASS_ENCODED}
      - traefik.http.middlewares.3xui-basic-auth.basicauth.realm=3x-ui

      # Цепочки middleware
      - traefik.http.middlewares.3xui-sub-chain.chain.middlewares=3xui-static-chain
      - traefik.http.middlewares.3xui-panel-chain.chain.middlewares=3xui-basic-auth,3xui-api-chain
      - traefik.http.middlewares.3xui-static-chain.chain.middlewares=3xui-compress
      - traefik.http.middlewares.3xui-api-chain.chain.middlewares=3xui-rate-limit,3xui-compress

      # ---------- Роутеры (HTTPS) ----------

      # Health-чек панели
      - traefik.http.routers.3xui-health.rule=Host(`${WEBDOMAIN}`) && Path(`/${URI_PANEL_PATH}/health`)
      - traefik.http.routers.3xui-health.entrypoints=websecure
      - traefik.http.routers.3xui-health.tls.certresolver=le
      - traefik.http.routers.3xui-health.service=3xui-panel-svc
      - traefik.http.routers.3xui-health.priority=9995

      # Раздача assets
      - traefik.http.routers.3xui-assets.rule=Host(`${WEBDOMAIN}`) && PathPrefix(`/assets/`)
      - traefik.http.routers.3xui-assets.entrypoints=websecure
      - traefik.http.routers.3xui-assets.middlewares=bouncer@file,3xui-static-chain
      - traefik.http.routers.3xui-assets.tls.certresolver=le
      - traefik.http.routers.3xui-assets.service=3xui-sub-svc
      - traefik.http.routers.3xui-assets.priority=9996

      # Панель администратора
      - traefik.http.routers.3xui-panel.rule=Host(`${WEBDOMAIN}`) && PathPrefix(`/${URI_PANEL_PATH}`)
      - traefik.http.routers.3xui-panel.entrypoints=websecure
      - traefik.http.routers.3xui-panel.middlewares=bouncer@file,3xui-panel-chain
      - traefik.http.routers.3xui-panel.tls.certresolver=le
      - traefik.http.routers.3xui-panel.service=3xui-panel-svc
      - traefik.http.routers.3xui-panel.priority=9997

      # Подписки и Clash-эндпоинты. JSON-подписки перехватывает sub-json-processor.
      - traefik.http.routers.3xui-sub.rule=Host(`${WEBDOMAIN}`) && (PathPrefix(`${URI_SUB_PATH}`) || PathPrefix(`${URI_CLASH_PATH:-/clash/}`))
      - traefik.http.routers.3xui-sub.entrypoints=websecure
      - traefik.http.routers.3xui-sub.middlewares=bouncer@file,3xui-sub-chain
      - traefik.http.routers.3xui-sub.tls.certresolver=le
      - traefik.http.routers.3xui-sub.service=3xui-sub-svc
      - traefik.http.routers.3xui-sub.priority=9998

      # XHTTP plain endpoint for subscription clients generated by 3x-ui:
      # security=none, type=xhttp, public port 443. This mirrors the old file-provider
      # router on l4tcp and coexists with the TLS passthrough Reality router below.
      - traefik.http.routers.xhttp3xui-l4.rule=Host(`${WEBDOMAIN}`) && PathPrefix(`${URI_VLESS_XHTTP}`)
      - traefik.http.routers.xhttp3xui-l4.entrypoints=l4tcp
      - traefik.http.routers.xhttp3xui-l4.service=xhttp3xui-svc
      - traefik.http.routers.xhttp3xui-l4.priority=9999
      - traefik.http.routers.xhttp3xui-l4.observability.accessLogs=false

      # Optional HTTPS endpoint used by Traefik websecure (:4443) and by
      # non-Vision TLS traffic after the Reality fallback to traefik:4443.
      - traefik.http.routers.xhttp3xui.rule=Host(`${WEBDOMAIN}`) && PathPrefix(`${URI_VLESS_XHTTP}`)
      - traefik.http.routers.xhttp3xui.entrypoints=websecure
      - traefik.http.routers.xhttp3xui.tls.certresolver=le
      - traefik.http.routers.xhttp3xui.service=xhttp3xui-svc
      - traefik.http.routers.xhttp3xui.priority=9999
      - traefik.http.routers.xhttp3xui.observability.accessLogs=false

      # ---------- L4 / TCP / UDP маршруты ----------
      # All public :443/TCP TLS enters Xray first. Vision REALITY is handled there;
      # non-Vision TLS falls back from Xray to traefik:4443 for HTTP termination.
      - traefik.tcp.routers.vless-reality.entrypoints=l4tcp
      - traefik.tcp.routers.vless-reality.rule=HostSNI(`*`)
      - traefik.tcp.routers.vless-reality.tls.passthrough=true
      - traefik.tcp.routers.vless-reality.service=vless-reality-svc
      - traefik.tcp.routers.vless-reality.priority=1

      # Backend порт для VLESS Reality
      - traefik.tcp.services.vless-reality-svc.loadbalancer.server.port=${PORT_LOCAL_VISION}
