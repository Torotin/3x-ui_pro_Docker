      # - traefik.http.middlewares.bouncer.plugin.bouncer.clientTrustedIPs=172.18.0.0/24,172.19.0.0/24
      # - traefik.http.middlewares.bouncer.plugin.bouncer.crowdsecLapiTimeout=5s
