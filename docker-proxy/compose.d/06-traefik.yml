services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    depends_on:
      crowdsec:
        condition: service_healthy
      crowdsec-firewall-bouncer:
        condition: service_healthy
      caddy:
        condition: service_healthy
    env_file:
      - ./.env
    # DPI: plugins.traefik.io often times out on IPv4; pull plugins via usque/WARP.
    # environment:
    #   ALL_PROXY: socks5h://usque:1080
    #   HTTPS_PROXY: socks5h://usque:1080
    #   HTTP_PROXY: socks5h://usque:1080
    #   NO_PROXY: localhost,127.0.0.1,crowdsec,usque,traefik,caddy,adguard,3x-ui,::1,172.18.0.0/24,172.19.0.0/24
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/acme.json:/acme.json
      - ../traefik/dynamic:/dynamic:ro
      - ../_logs/traefik:/logs
    ports:
      - "80:80"
      - "127.0.0.1:${PORT_LOCAL_ADMIN:-9443}:9443"
    entrypoint: ["sh", "-c", "touch /acme.json && chmod 600 /acme.json && chown root:root /acme.json && exec traefik"]
    networks:
      traefik-proxy:
        ipv4_address: 172.18.0.6
        ipv6_address: fd00:dead:beef:12::6
      dns-net:
        ipv4_address: 172.19.0.6
        ipv6_address: fd00:dead:beef:13::6
    # dns:
    #   - 172.19.0.10
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x traefik >/dev/null && nc -z 127.0.0.1 80 && nc -z 127.0.0.1 4443 && nc -z 127.0.0.1 9443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.tags=traefik

      # ---------- Basic Auth ----------
      # Авторизация для доступа к dashboard/metrics/ping
      - traefik.http.middlewares.basic-auth.basicauth.realm=Basic Authentication
      - traefik.http.middlewares.basic-auth.basicauth.users=${HT_PASS_ENCODED}

      # ---------- Базовые middleware ----------
      # Сжатие
      - traefik.http.middlewares.compress.compress=true

      # Лимитирование запросов
      - traefik.http.middlewares.rate-limit.ratelimit.average=50
      - traefik.http.middlewares.rate-limit.ratelimit.burst=100

      # Основная защищённая цепочка для админок
      - traefik.http.middlewares.secured-chain.chain.middlewares=bouncer@file,basic-auth,rate-limit,admin-security-headers@file,compress
      - traefik.http.middlewares.dashboard-manifest-chain.chain.middlewares=bouncer@file,rate-limit,admin-security-headers@file,dash-strip-prefix,compress

      # API-цепочка для внутренних web-service маршрутов без BasicAuth
      - traefik.http.middlewares.api-chain.chain.middlewares=rate-limit,compress

      # Статические файлы — только compress
      - traefik.http.middlewares.static-chain.chain.middlewares=compress

      # ---------- Traefik dashboard on private admin Host (self-signed) ----------
      - traefik.http.middlewares.admin-dash-chain.chain.middlewares=basic-auth,rate-limit,admin-security-headers@file,compress
      # Root → /dashboard/ (URI_TRAEFIK_DASHBOARD is not a URL path)
      - traefik.http.middlewares.traefik-root-redirect.redirectregex.regex=^(https?)://([^/]+)/?$$
      - traefik.http.middlewares.traefik-root-redirect.redirectregex.replacement=$${1}://$${2}/dashboard/
      - traefik.http.middlewares.traefik-root-redirect.redirectregex.permanent=false
      - traefik.http.routers.traefik-root.rule=Host(`traefik.${WEBDOMAIN}`) && Path(`/`)
      - traefik.http.routers.traefik-root.entrypoints=admin
      - traefik.http.routers.traefik-root.middlewares=traefik-root-redirect
      - traefik.http.routers.traefik-root.tls=true
      - traefik.http.routers.traefik-root.service=api@internal
      - traefik.http.routers.traefik-root.priority=90
      - traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${WEBDOMAIN}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      - traefik.http.routers.traefik-dashboard.entrypoints=admin
      - traefik.http.routers.traefik-dashboard.middlewares=admin-dash-chain
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard.tls=true
      - traefik.http.routers.traefik-dashboard.priority=100

      - traefik.http.routers.traefik-metrics.rule=Host(`traefik.${WEBDOMAIN}`) && Path(`/metrics`)
      - traefik.http.routers.traefik-metrics.entrypoints=admin
      - traefik.http.routers.traefik-metrics.middlewares=admin-dash-chain
      - traefik.http.routers.traefik-metrics.service=api@internal
      - traefik.http.routers.traefik-metrics.tls=true
      - traefik.http.routers.traefik-metrics.priority=110

      # ---------- CROWDSEC BOUNCER ----------
      # - traefik.http.middlewares.bouncer.plugin.bouncer.enabled=true
      # - traefik.http.middlewares.bouncer.plugin.bouncer.mode=live
      # - traefik.http.middlewares.bouncer.plugin.bouncer.logLevel=INFO
      # - traefik.http.middlewares.bouncer.plugin.bouncer.updateIntervalSeconds=10
      # - traefik.http.middlewares.bouncer.plugin.bouncer.updateMaxFailure=3
      # - traefik.http.middlewares.bouncer.plugin.bouncer.defaultDecisionSeconds=10
