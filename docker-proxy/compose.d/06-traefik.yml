      # - traefik.http.middlewares.bouncer.plugin.bouncer.crowdsecMode=stream
      # - traefik.http.middlewares.bouncer.plugin.bouncer.crowdsecAppsecEnabled=true
      # - traefik.http.middlewares.bouncer.plugin.bouncer.crowdsecAppsecFailureBlock=true
      # - traefik.http.middlewares.bouncer.plugin.bouncer.crowdsecAppsecUnreachableBlock=false
      # - traefik.http.middlewares.bouncer.plugin.bouncer.crowdsecAppsecHost=crowdsec:7422
      # - traefik.http.middlewares.bouncer.plugin.bouncer.crowdsecLapiKey=${CROWDSEC_API_KEY_TRAEFIK}
      # - traefik.http.middlewares.bouncer.plugin.bouncer.crowdsecLapiHost=crowdsec:8080
