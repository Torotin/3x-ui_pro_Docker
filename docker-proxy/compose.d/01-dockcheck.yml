services:
  dockcheck:
    image: alpine:3.20
    container_name: dockcheck
    hostname: ${WEBDOMAIN}
    restart: unless-stopped
    init: true
    environment:
      # Container timezone.
      TZ: ${TZ}
      # Delay between dockcheck runs. Supports h, m, s; h/m may be fractional.
      DOCKCHECK_INTERVAL: ${DOCKCHECK_INTERVAL:-24h}
      # One-time delay before the first check after container start.
      DOCKCHECK_INITIAL_DELAY_SECONDS: ${DOCKCHECK_INITIAL_DELAY_SECONDS:-30}
      # Download dockcheck.sh on container start, or when the local copy is missing.
      DOCKCHECK_SCRIPTUPDATE: ${DOCKCHECK_SCRIPTUPDATE:-true}
      # AutoMode: update automatically without interactive prompts.
      DOCKCHECK_AUTOMODE: ${DOCKCHECK_AUTOMODE:-true}
      # AutoPrune: prune dangling images after update.
      DOCKCHECK_AUTOPRUNE: ${DOCKCHECK_AUTOPRUNE:-false}
      # AutoSelfUpdate: allow dockcheck.sh to update itself and restart.
      DOCKCHECK_AUTOSELFUPDATE: ${DOCKCHECK_AUTOSELFUPDATE:-false}
      # BackupForDays: keep backup image tags for N days; empty disables backups.
      DOCKCHECK_BACKUPFORDAYS: ${DOCKCHECK_BACKUPFORDAYS:-}
      # BarWidth: progress bar width in characters.
      DOCKCHECK_BARWIDTH: ${DOCKCHECK_BARWIDTH:-50}
      # CurlConnectTimeout: registry curl connect timeout in seconds.
      DOCKCHECK_CURLCONNECTTIMEOUT: ${DOCKCHECK_CURLCONNECTTIMEOUT:-5}
      # CurlRetryCount: registry curl retry count.
      DOCKCHECK_CURLRETRYCOUNT: ${DOCKCHECK_CURLRETRYCOUNT:-3}
      # CurlRetryDelay: delay between registry curl retries in seconds.
      DOCKCHECK_CURLRETRYDELAY: ${DOCKCHECK_CURLRETRYDELAY:-1}
      # DaysOld: update only images that are at least N days old; empty disables.
      DOCKCHECK_DAYSOLD: ${DOCKCHECK_DAYSOLD:-}
      # DisplaySourcedFiles: print sourced dockcheck config files.
      DOCKCHECK_DISPLAYSOURCEDFILES: ${DOCKCHECK_DISPLAYSOURCEDFILES:-false}
      # DontUpdate: check only, without applying updates.
      DOCKCHECK_DONTUPDATE: ${DOCKCHECK_DONTUPDATE:-false}
      # DRunUp: also check docker-run containers; they must be recreated manually.
      DOCKCHECK_DRUNUP: ${DOCKCHECK_DRUNUP:-false}
      # Exclude: comma-separated container names to exclude.
      DOCKCHECK_EXCLUDE: ${DOCKCHECK_EXCLUDE:-dockcheck}
      # ForceRestartStacks: force compose down/up for stacks after updates.
      DOCKCHECK_FORCERESTARTSTACKS: ${DOCKCHECK_FORCERESTARTSTACKS:-false}
      # MaxAsync: maximum number of parallel registry checks.
      DOCKCHECK_MAXASYNC: ${DOCKCHECK_MAXASYNC:-10}
      # MonoMode: disable colors and hide progress bar.
      DOCKCHECK_MONOMODE: ${DOCKCHECK_MONOMODE:-false}
      # Notify: send configured notifications.
      DOCKCHECK_NOTIFY: ${DOCKCHECK_NOTIFY:-false}
      # OnlyShowUpdateable: show only containers with updates.
      DOCKCHECK_ONLYSHOWUPDATEABLE: ${DOCKCHECK_ONLYSHOWUPDATEABLE:-false}
      # OnlyLabel: check only containers with the dockcheck update label.
      DOCKCHECK_ONLYLABEL: ${DOCKCHECK_ONLYLABEL:-false}
      # OnlySpecific: recreate only the updated compose service, not the full stack.
      DOCKCHECK_ONLYSPECIFIC: ${DOCKCHECK_ONLYSPECIFIC:-true}
      # PrintMarkdownURL: print custom release note URLs as markdown.
      DOCKCHECK_PRINTMARKDOWNURL: ${DOCKCHECK_PRINTMARKDOWNURL:-false}
      # PrintReleaseURL: print custom release note URLs in CLI output.
      DOCKCHECK_PRINTRELEASEURL: ${DOCKCHECK_PRINTRELEASEURL:-false}
      # SkipRecreate: pull newer images but skip container recreation.
      DOCKCHECK_SKIPRECREATE: ${DOCKCHECK_SKIPRECREATE:-false}
      # Stopped: set to "-a" to include stopped containers.
      DOCKCHECK_STOPPED: ${DOCKCHECK_STOPPED:-}
      # Timeout: registry check timeout per container, in seconds.
      DOCKCHECK_TIMEOUT: ${DOCKCHECK_TIMEOUT:-10}
      # regctl binary version to download; use "latest" or a release tag.
      REGCTL_VERSION: ${REGCTL_VERSION:-latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/docker-proxy/compose.d:/opt/docker-proxy/compose.d:ro
      - /opt/docker-proxy/dockcheck:/opt/dockcheck
      - /etc/localtime:/etc/localtime:ro
    security_opt:
      - no-new-privileges=true
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache \
          bash \
          ca-certificates \
          coreutils \
          curl \
          docker-cli \
          docker-cli-compose \
          findutils \
          jq \
          tzdata

        mkdir -p /opt/dockcheck

        if [ "$${DOCKCHECK_SCRIPTUPDATE}" = "true" ] || [ ! -x /opt/dockcheck/dockcheck.sh ]; then
          curl -fsSL \
            https://raw.githubusercontent.com/mag37/dockcheck/main/dockcheck.sh \
            -o /opt/dockcheck/dockcheck.sh
          chmod +x /opt/dockcheck/dockcheck.sh
        fi

        if [ ! -x /opt/dockcheck/regctl ]; then
          case "$(uname -m)" in
            x86_64) regctl_arch="amd64" ;;
            aarch64|arm64) regctl_arch="arm64" ;;
            *)
              echo "[dockcheck] unsupported architecture for regctl: $(uname -m)" >&2
              exit 1
              ;;
          esac

          if [ "$${REGCTL_VERSION}" = "latest" ]; then
            regctl_url="https://github.com/regclient/regclient/releases/latest/download/regctl-linux-$${regctl_arch}"
          else
            regctl_url="https://github.com/regclient/regclient/releases/download/$${REGCTL_VERSION}/regctl-linux-$${regctl_arch}"
          fi

          curl -fsSL "$${regctl_url}" -o /opt/dockcheck/regctl
          chmod +x /opt/dockcheck/regctl
        fi

        export PATH="/opt/dockcheck:$${PATH}"

        write_config_var() {
          name="$$1"
          value="$$2"
          [ -n "$${value}" ] || return 0
          printf '%s=%s\n' "$${name}" "$${value}" >> /opt/dockcheck/dockcheck.config
        }

        : > /opt/dockcheck/dockcheck.config
        write_config_var AutoMode "$${DOCKCHECK_AUTOMODE}"
        write_config_var AutoPrune "$${DOCKCHECK_AUTOPRUNE}"
        write_config_var AutoSelfUpdate "$${DOCKCHECK_AUTOSELFUPDATE}"
        write_config_var BackupForDays "$${DOCKCHECK_BACKUPFORDAYS}"
        write_config_var BarWidth "$${DOCKCHECK_BARWIDTH}"
        write_config_var CurlConnectTimeout "$${DOCKCHECK_CURLCONNECTTIMEOUT}"
        write_config_var CurlRetryCount "$${DOCKCHECK_CURLRETRYCOUNT}"
        write_config_var CurlRetryDelay "$${DOCKCHECK_CURLRETRYDELAY}"
        write_config_var DaysOld "$${DOCKCHECK_DAYSOLD}"
        write_config_var DisplaySourcedFiles "$${DOCKCHECK_DISPLAYSOURCEDFILES}"
        write_config_var DontUpdate "$${DOCKCHECK_DONTUPDATE}"
        write_config_var DRunUp "$${DOCKCHECK_DRUNUP}"
        write_config_var Exclude "\"$${DOCKCHECK_EXCLUDE}\""
        write_config_var ForceRestartStacks "$${DOCKCHECK_FORCERESTARTSTACKS}"
        write_config_var MaxAsync "$${DOCKCHECK_MAXASYNC}"
        write_config_var MonoMode "$${DOCKCHECK_MONOMODE}"
        write_config_var Notify "$${DOCKCHECK_NOTIFY}"
        write_config_var OnlyShowUpdateable "$${DOCKCHECK_ONLYSHOWUPDATEABLE}"
        write_config_var OnlyLabel "$${DOCKCHECK_ONLYLABEL}"
        write_config_var OnlySpecific "$${DOCKCHECK_ONLYSPECIFIC}"
        write_config_var PrintMarkdownURL "$${DOCKCHECK_PRINTMARKDOWNURL}"
        write_config_var PrintReleaseURL "$${DOCKCHECK_PRINTRELEASEURL}"
        write_config_var SkipRecreate "$${DOCKCHECK_SKIPRECREATE}"
        write_config_var Stopped "\"$${DOCKCHECK_STOPPED}\""
        write_config_var Timeout "$${DOCKCHECK_TIMEOUT}"

        dockcheck_interval_seconds="$$(awk -v interval="$${DOCKCHECK_INTERVAL}" 'BEGIN {
          gsub(",", ".", interval)
          if (interval !~ /^[0-9]+([.][0-9]+)?[hms]?$$/) {
            exit 1
          }

          unit = substr(interval, length(interval), 1)
          value = interval
          if (unit ~ /[hms]/) {
            value = substr(interval, 1, length(interval) - 1)
          } else {
            unit = "h"
          }

          if (value <= 0) {
            exit 1
          }
          if (unit == "h") {
            seconds = int((value * 3600) + 0.5)
          } else if (unit == "m") {
            seconds = int((value * 60) + 0.5)
          } else {
            if (value !~ /^[0-9]+$$/) {
              exit 1
            }
            seconds = value
          }
          if (seconds < 1) {
            seconds = 1
          }
          print seconds
        }')" || {
          echo "[dockcheck] invalid DOCKCHECK_INTERVAL: $${DOCKCHECK_INTERVAL}" >&2
          exit 1
        }

        if [ "$${DOCKCHECK_INITIAL_DELAY_SECONDS}" -gt 0 ]; then
          echo "[dockcheck] initial delay: $${DOCKCHECK_INITIAL_DELAY_SECONDS}s"
          sleep "$${DOCKCHECK_INITIAL_DELAY_SECONDS}"
        fi

        while true; do
          echo "[dockcheck] run started: $(date -Iseconds)"
          echo "[dockcheck] config: /opt/dockcheck/dockcheck.config"
          if /bin/bash /opt/dockcheck/dockcheck.sh; then
            echo "[dockcheck] run finished successfully"
          else
            rc=$?
            echo "[dockcheck] run failed with rc=$${rc}" >&2
          fi
          echo "[dockcheck] next run in $${DOCKCHECK_INTERVAL} ($${dockcheck_interval_seconds}s)"
          sleep "$${dockcheck_interval_seconds}"
        done
    labels:
      - traefik.enable=false
      - mag37.dockcheck.update=false
