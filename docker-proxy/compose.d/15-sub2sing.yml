services:
  sub2sing:
    image: ghcr.io/legiz-ru/sub2sing-box:latest
    container_name: sub2sing
    restart: unless-stopped
    extra_hosts:
      - ${WEBDOMAIN}:${PUBLIC_IPV4}
    networks:
      traefik-proxy:
        ipv4_address: 172.18.0.15
      dns-net:
        ipv4_address: 172.19.0.15
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.tags=traefik

      # Router: API только на /${URI_SUB2SING}/convert -> sub2sing-box (port 8080)
      - traefik.http.routers.sub2sing.rule=Host(`${WEBDOMAIN}`) && PathPrefix(`/${URI_SUB2SING}/convert`)
      - traefik.http.routers.sub2sing.entrypoints=websecure
      - traefik.http.routers.sub2sing.middlewares=sub2sing-strip,sub2sing-compress
      - traefik.http.routers.sub2sing.tls.certresolver=le
      - traefik.http.routers.sub2sing.priority=10000
      - traefik.http.routers.sub2sing.service=sub2sing-svc

      # Middlewares
      - traefik.http.middlewares.sub2sing-strip.stripPrefix.prefixes=/${URI_SUB2SING}
      - traefik.http.middlewares.sub2sing-compress.compress=true

      # Service
      - traefik.http.services.sub2sing-svc.loadbalancer.server.port=8080
