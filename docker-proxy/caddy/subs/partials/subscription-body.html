<a-form layout="vertical">
    <a-form-item>
        <a-space direction="vertical" align="center">
            <a-row type="flex" :gutter="[8,8]" justify="center" style="width:100%">
                <a-col :xs="24" :sm="app.subJsonUrl ? 12 : 24" style="text-align:center;">
                    <tr-qr-box class="qr-box">
                        <a-tag color="purple" class="qr-tag">
                            <span>Подписка</span>
                        </a-tag>
                        <tr-qr-bg class="qr-bg-sub">
                            <tr-qr-bg-inner class="qr-bg-sub-inner">
                                <canvas id="qrcode" class="qr-cv" title='Копировать' @click="copy(app.subUrl)"></canvas>
                            </tr-qr-bg-inner>
                        </tr-qr-bg>
                    </tr-qr-box>
                </a-col>
                <a-col v-if="app.subJsonUrl" :xs="24" :sm="12" style="text-align:center;">
                    <tr-qr-box class="qr-box">
                        <a-tag color="purple" class="qr-tag">
                            <span>Подписка Json</span>
                        </a-tag>
                        <tr-qr-bg class="qr-bg-sub">
                            <tr-qr-bg-inner class="qr-bg-sub-inner">
                                <canvas id="qrcode-subjson" class="qr-cv" title='Копировать' @click="copy(app.subJsonUrl)"></canvas>
                            </tr-qr-bg-inner>
                        </tr-qr-bg>
                    </tr-qr-box>
                </a-col>
            </a-row>
        </a-space>
    </a-form-item>

    <a-form-item>
        <a-collapse :default-active-key="[]">
            <a-collapse-panel key="info" header="Информация о подписке">
                <a-descriptions bordered :column="1" size="small">
                    <a-descriptions-item label='ID подписки'>[[ app.sId ]]</a-descriptions-item>
                    <a-descriptions-item label='Статус'>
                        <template v-if="isUnlimited">
                            <a-tag color="purple">Безлимит</a-tag>
                        </template>
                        <template v-else>
                            <a-tag :color="isActive ? 'green' : 'red'">[[ isActive ? 'Активна' : 'Неактивна' ]]</a-tag>
                        </template>
                    </a-descriptions-item>
                    <a-descriptions-item label='Загружено'>[[ app.download ]]</a-descriptions-item>
                    <a-descriptions-item label='Отправлено'>[[ app.upload ]]</a-descriptions-item>
                    <a-descriptions-item label='Использование'>[[ app.used ]]</a-descriptions-item>
                    <a-descriptions-item label='Общий лимит'>[[ app.total ]]</a-descriptions-item>
                    <a-descriptions-item v-if="app.totalByte > 0" label='Остаток'>[[ app.remained ]]</a-descriptions-item>
                    <a-descriptions-item label='Был(а) в сети'>
                        <template v-if="app.lastOnlineMs > 0">
                            <template v-if="app.datepicker === 'gregorian'">
                                [[ DateUtil.formatMillis(app.lastOnlineMs) ]]
                            </template>
                            <template v-else>
                                [[ DateUtil.convertToJalalian(moment(app.lastOnlineMs)) ]]
                            </template>
                        </template>
                        <template v-else>
                            <span>Никогда</span>
                        </template>
                    </a-descriptions-item>
                    <a-descriptions-item label='Срок действия'>
                        <template v-if="app.expireMs === 0">
                            Без срока
                        </template>
                        <template v-else>
                            <template v-if="app.datepicker === 'gregorian'">
                                [[ DateUtil.formatMillis(app.expireMs) ]]
                            </template>
                            <template v-else>
                                [[ DateUtil.convertToJalalian(moment(app.expireMs)) ]]
                            </template>
                        </template>
                    </a-descriptions-item>
                </a-descriptions>
            </a-collapse-panel>
        </a-collapse>
    </a-form-item>
</a-form>

<a-card>
    <a-collapse>
        <a-collapse-panel key="manual" header="Инструкция по установке">
            <!-- Ваш контент мануала -->
        </a-collapse-panel>
    </a-collapse>
</a-card>

<br />
<a-list bordered>
    <a-list-item v-for="(link, idx) in links" :key="link">
        <div style="width:100%; text-align:center;">
            <a-button type="primary" :block="isMobile" @click="copy(link)">[[ linkName(link, idx) ]]</a-button>
        </div>
    </a-list-item>
</a-list>
<br />

<a-form layout="vertical">
    <a-form-item>
        <a-row type="flex" justify="center" :gutter="[8,8]" style="width:100%">
            <a-col :xs="24" :sm="12" style="text-align:center;">
                <a-dropdown :trigger="['click']">
                    <a-button icon="android" :block="isMobile" :style="{ marginTop: isMobile ? '6px' : 0 }" size="large" type="primary">
                        Android <a-icon type="down" />
                    </a-button>
                    <a-menu slot="overlay" :class="themeSwitcher.currentTheme">
                        <a-menu-item key="android-v2box" @click="open('v2box://install-sub?url=' + encodeURIComponent(app.subUrl) + '&name=' + encodeURIComponent(app.sId))">V2Box</a-menu-item>
                        <a-menu-item key="android-v2rayng" @click="open('v2rayng://install-config?url=' + encodeURIComponent(app.subUrl))">V2RayNG</a-menu-item>
                        <a-menu-item key="android-singbox" @click="copy(app.subUrl)">Sing-box</a-menu-item>
                        <a-menu-item key="android-v2raytun" @click="copy(app.subUrl)">V2RayTun</a-menu-item>
                        <a-menu-item key="android-npvtunnel" @click="copy(app.subUrl)">NPV Tunnel</a-menu-item>
                        <a-menu-item key="android-happ" @click="open('happ://add/' + encodeURIComponent(app.subUrl))">Happ</a-menu-item>
                    </a-menu>
                </a-dropdown>
            </a-col>
            <a-col :xs="24" :sm="12" style="text-align:center;">
                <a-dropdown :trigger="['click']">
                    <a-button icon="apple" :block="isMobile" :style="{ marginTop: isMobile ? '6px' : 0 }" size="large" type="primary">
                        iOS <a-icon type="down" />
                    </a-button>
                    <a-menu slot="overlay" :class="themeSwitcher.currentTheme">
                        <a-menu-item key="ios-shadowrocket" @click="open(shadowrocketUrl)">Shadowrocket</a-menu-item>
                        <a-menu-item key="ios-v2box" @click="open(v2boxUrl)">V2Box</a-menu-item>
                        <a-menu-item key="ios-streisand" @click="open(streisandUrl)">Streisand</a-menu-item>
                        <a-menu-item key="ios-v2raytun" @click="copy(v2raytunUrl)">V2RayTun</a-menu-item>
                        <a-menu-item key="ios-npvtunnel" @click="copy(npvtunUrl)">NPV Tunnel</a-menu-item>
                        <a-menu-item key="ios-happ" @click="open(happUrl)">Happ</a-menu-item>
                    </a-menu>
                </a-dropdown>
            </a-col>
        </a-row>
    </a-form-item>
</a-form>
