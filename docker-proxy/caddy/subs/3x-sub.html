

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">

  <script id="sub-config" type="application/json">
    {
      "URI_SUB_PATH": "{{env `URI_SUB_PATH`}}",
      "URI_JSON_PATH": "{{env `URI_JSON_PATH`}}",
      "WEBDOMAIN": "{{env `WEBDOMAIN`}}"
    }
  </script>

  <style>
    [v-cloak] { display: none; }
    .loading-mask {
      position: fixed; inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(88, 86, 214, 0.08), transparent 45%), #0f1118;
      color: #f0f0f0; display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.3s ease;
    }
    .loading-mask.hidden { opacity: 0; pointer-events: none; }
    .loading-box {
      text-align: center; padding: 18px 22px; border-radius: 12px;
      background: rgba(30, 32, 44, 0.9); box-shadow: 0 8px 32px rgba(0,0,0,0.35);
      min-width: 240px;
    }
    .spinner { width: 36px; height: 36px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #9254de; border-radius: 50%; margin: 0 auto 12px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-error { color: #ff7875; margin-top: 8px; font-size: 14px; }
    .loading-retry { margin-top: 10px; padding: 6px 12px; border: 1px solid #9254de; background: transparent; color: #fff; border-radius: 6px; cursor: pointer; }

    @font-face {
      font-display: swap;
      font-family: 'Vazirmatn';
      font-style: normal;
      font-weight: 400;
      src: url('assets/Vazirmatn-UI-NL-Regular.woff2') format('woff2');
      unicode-range: U+0600-06FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE80-FEFC, U+0030-0039;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Vazirmatn', 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
  </style>
  <title>{{env `WEBDOMAIN`}} – Информация о подписке</title>
</head>

<body>
  <div id="loading-mask" class="loading-mask">
    <div class="loading-box">
      <div class="spinner" aria-label="Загрузка"></div>
      <div id="loading-text">Загрузка подписки…</div>
      <div id="loading-error" class="loading-error" style="display:none"></div>
      <button id="loading-retry" class="loading-retry" style="display:none">Повторить</button>
    </div>
  </div>
  <div id="message"></div>

  <a-layout id="app" v-cloak :class="themeSwitcher.currentTheme + ' subscription-page'">
      <a-layout-content class="p-2">
          <a-row type="flex" justify="center" class="mt-2">
              <a-col :xs="24" :sm="22" :md="18" :lg="14" :xl="12">
                  <a-card hoverable class="subscription-card">
                      {{ include "partials/subscription-header.html" }}
                      {{ include "partials/subscription-body.html" }}
                  </a-card>
              </a-col>
          </a-row>
      </a-layout-content>
  </a-layout>

  <template id="subscription-data" data-sid="" data-sub-url=""
      data-subjson-url="" data-download="—"
      data-upload="—" data-used="—"
      data-total="—" data-remained="—"
      data-expire="0" data-lastonline="0"
      data-downloadbyte="0"
      data-uploadbyte="0" data-totalbyte="0"
      data-datepicker="gregorian"></template>
  <textarea id="subscription-links" style="display:none"></textarea>

  <script src="/js/sub-bootstrap.js"></script>
  <script src="/js/sub-theme.js"></script>
  <script src="/js/sub-init.js"></script>
</body>
</html>
