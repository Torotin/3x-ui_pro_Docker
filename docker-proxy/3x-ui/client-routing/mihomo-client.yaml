# =============================================================================
# GENERATED upstream — do not edit by hand in this repo.
# Source of truth: G:/mihomo/shared (profile 3xui-sub-clash)
# Rebuild: python shared/build.py --profile 3xui-sub-clash
# Copy:    G:/mihomo/generated/3xui/routing-mihomo-client.yaml
#       →  docker-proxy/3x-ui/client-routing/mihomo-client.yaml
# =============================================================================
mode: rule
log-level: warning
allow-lan: false
ipv6: true
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 600
keep-alive-interval: 30
find-process-mode: off
external-controller: 127.0.0.1:9090
profile:
  store-selected: true
  store-fake-ip: true

# ============================================================================
# === АНАЛИЗ ТРАФИКА (SNIFFER) ===
# ============================================================================
# «Подслушивание» трафика для определения доменных имён
# Позволяет корректно маршрутизировать даже при подключении по IP
# Критично для DOMAIN / RULE-SET правил
sniffer:
  enable: true # Включить сниффер
  parse-pure-ip: true # Анализировать соединения к «чистому» IP
  force-dns-mapping: true # Принудительный DNS-маппинг fake-ip → домен
  sniff:
    # Настройки для различных протоколов
    HTTP:
      ports: [80, 8080-8880] # Порты для HTTP-трафика
      override-destination: true # Подменять получателя трафика на домен
    TLS:
      ports: [443, 8443] # Порты для HTTPS/TLS-трафика
      override-destination: true # Подменять получателя на SNI (утечки DNS)
    QUIC:
      ports: [443, 8443] # Порты для QUIC-протокола (UDP/443)
  skip-domain:
    - 'Mijia Cloud'
    - '+.lan'
    - '+.local'
    - '+.push.apple.com'
    - '+.apple.com'
    - '+.cub.red'
    - '+.cub.best'
    - '+.cub.black'
    - '+.kurwa-bober.ninja'
    - '+.durex.monster'
    - '+.cubnotrip.top'

# ============================================================================
# === ОБЩИЕ ПАРАМЕТРЫ И ЯКОРЯ (ANCHORS) ===
# ============================================================================
# Якоря сокращают повторение одинаковых блоков в rule-/proxy-providers
anchors:
  domain:
    # HTTP MRS: домены
    &domain
    type: http
    format: mrs
    behavior: domain
    interval: 86400 # Обновление раз в сутки
  ipcidr:
    # HTTP MRS: IP-CIDR
    &ipcidr
    type: http
    format: mrs
    behavior: ipcidr
    interval: 86400
  classical:
    # HTTP text: classical list
    &classical
    type: http
    format: text
    behavior: classical
    interval: 86400
  domain_yaml:
    # HTTP YAML: домены (custom, не MRS)
    &domain_yaml
    type: http
    format: yaml
    behavior: domain
    interval: 86400
  ipcidr_yaml:
    # HTTP YAML: IP-CIDR (custom)
    &ipcidr_yaml
    type: http
    format: yaml
    behavior: ipcidr
    interval: 86400
  classical_yaml:
    # HTTP YAML: classical (torrent-clients)
    &classical_yaml
    type: http
    format: yaml
    behavior: classical
    interval: 86400
  inline:
    # Встроенный classical payload
    &inline
    type: inline
    behavior: classical


  # Health-check для proxy-providers
  # timeout — миллисекунды (как у url-test групп); interval — секунды
  health-check: &health-check
    enable: true # Включить проверку
    url: https://www.gstatic.com/generate_204 # URL для проверки доступности прокси
    interval: 1800 # Период проверки (сек)
    lazy: true # true = не долбить ноды, пока провайдер не используется
    timeout: 5000 # Таймаут (мс); 5 = 5 мс → все «мёртвые»
    expected-status: 204 # Ожидаемый HTTP-статус ответа

  # Базовый шаблон proxy-provider (подписка)
  pp: &pp
    type: http
    vehicle: compatible
    interval: 3600 # Обновление подписки (сек)
    health-check:
      <<: *health-check
  # Списки вариантов для сервисных селекторов (порядок в UI)
  via_proxy:
    # Магазин / логин → сначала прокси
    &via_proxy
    - PROXY
    - DIRECT
  via_direct:
    # Игры / загрузки → сначала DIRECT
    &via_direct
    - DIRECT
    - PROXY
  via_cdn:
    # CDN → PASS (дальше по rules) или PROXY
    &via_cdn
    - PASS
    - PROXY
  via_pass:
    # Google / GitHub / Apple / Docker → PASS по умолчанию
    &via_pass
    - PASS
    - PROXY
  # Иконки селекторов (Qure / Reddit)
  icon_proxy: &icon_proxy https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
  icon_steam: &icon_steam https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Steam.png
  icon_download: &icon_download https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Download.png
  icon_game: &icon_game https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png
  icon_reddit: &icon_reddit https://www.redditstatic.com/shreddit/assets/favicon/192x192.png
  icon_cloudflare: &icon_cloudflare https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Cloudflare.png
  icon_google: &icon_google https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png
  icon_github: &icon_github https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/GitHub.png
  icon_reject: &icon_reject https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Reject.png
  icon_apple: &icon_apple https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple.png
  icon_docker: &icon_docker https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Docker.png
  icon_twitch: &icon_twitch https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Twitch.png

