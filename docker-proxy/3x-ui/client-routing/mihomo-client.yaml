# ============================================================================
# === ГРУППЫ ПРОКСИ (PROXY GROUPS / СЕЛЕКТОРЫ) — 3x-ui Clash sub ===
# ============================================================================
# Без секции proxy-providers — PROXY/AUTO берут ноды из Clash-подписки (include-all).
proxy-groups:

  # --- автовыбор (скрыт) ---
  - name: AUTO # url-test по нодам этой подписки → «PROXY»
    type: url-test # Выбор по минимальной задержке
    hidden: true # Не показывать в панели селекторов
    include-all: true # все proxies из Clash-подписки 3x-ui
    url: https://www.gstatic.com/generate_204
    interval: 300 # Интервал теста (сек)
    tolerance: 50 # Не переключать при Δ < 50 мс
    lazy: true
    timeout: 5000

  # --- главный исходящий ---
  - name: PROXY # Основной селектор (аналог SELECTOR)
    type: select # Ручной выбор
    icon: *icon_proxy
    include-all: true # все proxies из Clash-подписки 3x-ui
    proxies:
      - AUTO
    default-selected: AUTO

  # --- игры ---
  - name: Steam # Магазин / логин / клиент / Cloud
    type: select
    icon: *icon_steam
    proxies: *via_proxy # PROXY → DIRECT
    default-selected: PROXY

  - name: Steam Downloads # Контент / CDN загрузок
    type: select
    icon: *icon_download
    proxies:
      - DIRECT
      - PROXY
      - PASS # Продолжить матчинг правил
    default-selected: DIRECT

  - name: Blizzard # Battle.net / игры
    type: select
    icon: *icon_game
    proxies: *via_direct # DIRECT → PROXY
    default-selected: DIRECT

  - name: Reddit
    type: select
    icon: *icon_reddit
    proxies: *via_direct # DIRECT → PROXY
    default-selected: DIRECT

  - name: Twitch
    type: select
    icon: *icon_twitch
    proxies: *via_proxy # PROXY → DIRECT
    default-selected: PROXY

  # --- инфраструктура ---
  - name: Apple # iCloud / Apple services
    type: select
    icon: *icon_apple
    proxies: *via_pass # PASS → PROXY
    default-selected: PASS

  - name: Docker # Docker Hub / registry
    type: select
    icon: *icon_docker
    proxies: *via_pass # PASS → PROXY
    default-selected: PASS

  - name: CDN # Облачные / CDN IP
    type: select
    icon: *icon_cloudflare
    proxies: *via_cdn # PASS → PROXY
    default-selected: PASS

  - name: Google # PASS = продолжить матчинг правил
    type: select
    icon: *icon_google
    proxies: *via_pass # PASS → PROXY
    default-selected: PASS

  - name: GitHub
    type: select
    icon: *icon_github
    proxies: *via_pass # PASS → PROXY
    default-selected: PASS

  - name: QUIC # UDP/443
    type: select
    icon: *icon_reject
    proxies:
      - PASS
      - REJECT
    default-selected: PASS # По умолчанию пропускать QUIC (дальше по rules)

# ============================================================================
