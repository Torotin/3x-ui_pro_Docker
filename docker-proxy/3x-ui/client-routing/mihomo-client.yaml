# ============================================================================
# === ПРАВИЛА МАРШРУТИЗАЦИИ (RULES) ===
# ============================================================================
# Сверху вниз; первое совпадение побеждает — не переставляйте блоки без нужды
rules:

  # >>> ADMIN_RULES
  # <<< ADMIN_RULES

  # --- 1. Ads / QUIC / NetBIOS ---
  - RULE-SET,adlist,REJECT # Реклама / трекеры → всегда блок
  # QUIC вне RU и вне Яндекс 360 → селектор QUIC
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((OR,((RULE-SET,ru-ips),(RULE-SET,yandex-360-ips)))))),QUIC
  - RULE-SET,netbios,REJECT # NetBIOS UDP

  # --- 2. LAN / private (Stargate-style reserved + local suffixes) ---
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve # Частная сеть 10.x (часто VPN/корп. LAN)
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve # CGNAT оператора (100.64–100.127)
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve # localhost (этот же хост)
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve # Автоадресация без DHCP (APIPA)
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve # Частная сеть 172.16–172.31
  - IP-CIDR,192.0.0.0/24,DIRECT,no-resolve # Reserved, RFC3330
  - IP-CIDR,192.0.2.0/24,DIRECT,no-resolve # TEST-NET-1
  - IP-CIDR,192.88.99.0/24,DIRECT,no-resolve # 6to4 anycast
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve # Домашняя LAN (192.168.x)
  # не добавлять 198.18.0.0/15 — пересекается с fake-ip-range
  - IP-CIDR,198.51.100.0/24,DIRECT,no-resolve # TEST-NET-2
  - IP-CIDR,203.0.113.0/24,DIRECT,no-resolve # TEST-NET-3
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve # Multicast (не через прокси)
  - DOMAIN-SUFFIX,lan,DIRECT # Домены *.lan
  - DOMAIN-SUFFIX,local,DIRECT # Домены *.local (mDNS)
  - DOMAIN-SUFFIX,localdomain,DIRECT # Локальный суффикс
  - DOMAIN-SUFFIX,internal,DIRECT # Локальный суффикс
  - DOMAIN-SUFFIX,home.arpa,DIRECT # Домашние имена RFC8375
  - RULE-SET,private-domains,DIRECT # geosite private

  # --- 2b. Yandex 360 → DIRECT (до PROXY/CDN; офиц. network-settings) ---
  - OR,((RULE-SET,yandex-360-domains),(RULE-SET,yandex-360-ips,no-resolve)),DIRECT

  # --- 2c. Ручные DIRECT до CDN/CF (иначе CF IP перебивает DOMAIN-SUFFIX) ---
  # Cub WSS :8443 (cub.red/best на Cloudflare anycast) иначе уходит в PROXY → NS_ERROR_NET_RESET
  - RULE-SET,direct-manual,DIRECT

  # --- 3. torrent + onion ---
  - RULE-SET,bittorrent-ports,DIRECT # Типовые BT-порты
  - RULE-SET,torrent-clients,DIRECT # PROCESS-NAME; при find-process-mode: off почти no-op
  - RULE-SET,torrent-trackers,DIRECT # announce / tracker hosts
  - RULE-SET,torrent-websites,PROXY # сайты трекеров
  - DOMAIN-SUFFIX,onion,PROXY # Tor onion

  # --- 4. Сервисы (выше RU / ZKEEN / refilter) ---
  - OR,((DOMAIN-SUFFIX,gql.twitch.tv),(DOMAIN-SUFFIX,usher.ttvnw.net)),Twitch # Twitch HLS / usher
  - RULE-SET,category-ai,PROXY # AI-сервисы (!cn) → PROXY
  - RULE-SET,misc-ai,PROXY # Stargate misc-ai: Grok/HF/JetBrains/… (без Docker — селектор Docker)
  - RULE-SET,steam-downloads,Steam Downloads # CDN загрузок Steam → Steam Downloads
  - OR,((RULE-SET,steam-domains),(DOMAIN-WILDCARD,steamcloud*),(RULE-SET,steam-ips,no-resolve)),Steam # Магазин / клиент / Cloud
  - OR,((RULE-SET,blizzard-domains),(RULE-SET,blizzard-extra),(RULE-SET,blizzard-asn,no-resolve),(RULE-SET,blizzard-ips,no-resolve)),Blizzard # Battle.net / игры + AS57976
  - RULE-SET,reddit,Reddit # Reddit → селектор Reddit
  - RULE-SET,spotify,PROXY # Spotify → PROXY
  - OR,((RULE-SET,youtube),(RULE-SET,youtube-ips,no-resolve),(RULE-SET,zkeen-youtube)),PROXY # YouTube домены + MRS IP + Anton
  - RULE-SET,twitch,Twitch # Twitch → селектор Twitch
  - RULE-SET,twitter,PROXY # Twitter / X → PROXY
  - RULE-SET,tiktok,PROXY # TikTok → PROXY
  - OR,((RULE-SET,discord-domains),(RULE-SET,discord-geosite),(RULE-SET,discord-ips,no-resolve),(RULE-SET,discord-voiceips,no-resolve)),PROXY # Discord домены + IP + voice MRS
  - AND,((RULE-SET,discord-ips),(NETWORK,UDP),(DST-PORT,19200-19400,50000-50100)),PROXY # Discord voice UDP (порты)
  - OR,((RULE-SET,whatsapp-domains),(RULE-SET,whatsapp-ips,no-resolve)),PROXY # WhatsApp домены + IP
  - RULE-SET,speedtest,PROXY # Speedtest / Ookla → PROXY
  - OR,((RULE-SET,meta),(RULE-SET,meta-ips,no-resolve)),PROXY # Facebook / Instagram / Meta + IP
  - OR,((RULE-SET,telegram-domains),(RULE-SET,telegram-ips,no-resolve)),PROXY # Telegram домены + IP
  - OR,((RULE-SET,roblox-domains),(RULE-SET,roblox-asn)),PROXY # Roblox домены + ASN
  - OR,((RULE-SET,netflix-domains),(RULE-SET,netflix-ips,no-resolve)),PROXY # Netflix домены + IP
  - RULE-SET,microsoft,PROXY # Microsoft / Office / Xbox / Login

  # --- 5. Google / GitHub / CDN / Apple / Docker ---
  - RULE-SET,github-domains,GitHub # GitHub → селектор (default PASS)
  - OR,((RULE-SET,google-domains),(RULE-SET,google-ips,no-resolve)),Google # Google домены / IP → Google
  - RULE-SET,icloud,Apple # iCloud → селектор Apple
  - RULE-SET,docker,Docker # Docker Hub → селектор Docker
  # DPI режет CF / AWS на DIRECT → всегда PROXY (не селектор CDN)
  - OR,((RULE-SET,cloudflare-domains),(RULE-SET,cloudflare-ips,no-resolve)),PROXY
  - OR,((RULE-SET,amazon-domains),(RULE-SET,amazon-ips,no-resolve)),PROXY
  - RULE-SET,cloudfront-ips,PROXY # AWS CloudFront (MetaCubeX MRS)
  # Прочие CDN / cloud IP → селектор CDN (default PASS)
  - OR,((RULE-SET,akamai-domains),(RULE-SET,akamai-ips,no-resolve)),CDN
  - RULE-SET,arelion-ips,CDN
  - RULE-SET,azure-ips,CDN
  - RULE-SET,bunnycdn-ips,CDN
  - RULE-SET,cdn77-ips,CDN
  - RULE-SET,colocrossing-ips,CDN
  - RULE-SET,contabo-ips,CDN
  - OR,((RULE-SET,digitalocean-domains),(RULE-SET,digitalocean-ips,no-resolve)),CDN
  - OR,((RULE-SET,fastly-domains),(RULE-SET,fastly-ips,no-resolve)),CDN
  - RULE-SET,frantech-ips,CDN
  - RULE-SET,gcore-ips,CDN
  - OR,((RULE-SET,hetzner-domains),(RULE-SET,hetzner-ips,no-resolve)),CDN
  - RULE-SET,leaseweb-ips,CDN
  - RULE-SET,linode-ips,CDN
  - RULE-SET,liquidweb-ips,CDN
  - RULE-SET,mega-ips,CDN
  - RULE-SET,melbicom-ips,CDN
  - OR,((RULE-SET,oracle-domains),(RULE-SET,oracle-ips,no-resolve)),CDN
  - RULE-SET,ovh-ips,CDN
  - RULE-SET,scaleway-ips,CDN
  - RULE-SET,vodafone-ips,CDN
  - RULE-SET,vultr-ips,CDN
  - RULE-SET,cogent-ips,CDN
  - RULE-SET,datacamp-ips,CDN

  # --- 6. curated geosite → PROXY ---
  - RULE-SET,onedrive,PROXY # OneDrive
  - RULE-SET,paypal,PROXY # PayPal
  - RULE-SET,visa,PROXY # Visa
  - RULE-SET,mastercard,PROXY # Mastercard
  - RULE-SET,samsung,PROXY # Samsung
  - RULE-SET,category-anticensorship,PROXY # Антицензура / обход
  - RULE-SET,category-games,PROXY # Игры (общая категория)
  - RULE-SET,category-media-ru-blocked,PROXY # Медиа, заблокированные в РФ

  # --- 7. ручные → PROXY (до RU, иначе *.ru в proxy-manual недостижимы) ---
  - RULE-SET,proxy-manual,PROXY # Ручной список доменов / keyword

  # --- 8. RU → DIRECT (после сервисов / CDN / proxy-manual; Yandex 360 — в §2b; direct-manual — в §2c) ---
  - OR,((RULE-SET,ru-tld-suffix),(RULE-SET,ru-tld)),DIRECT # RU/СНГ TLD / tld-ru MRS
  - OR,((RULE-SET,ru-category),(RULE-SET,ru-bank),(RULE-SET,ru-betting),(RULE-SET,ru-ecommerce),(RULE-SET,ru-entertainment),(RULE-SET,ru-gov),(RULE-SET,ru-media),(RULE-SET,ru-medicine),(RULE-SET,ru-retail),(RULE-SET,ru-travel),(RULE-SET,ru-genotek),(RULE-SET,ru-ideco),(RULE-SET,ru-myoffice),(RULE-SET,ru-tbank),(RULE-SET,ru-yandex),(RULE-SET,ru-vk)),DIRECT # Категории и сервисы РФ

  # --- 9. ECH / Re-filter (всегда PROXY: DPI режет ECH-handshake на DIRECT) ---
  - DOMAIN,cloudflare-ech.com,PROXY # ECH bootstrap
  - RULE-SET,refilter-ech,PROXY # Sites с ECH
  - RULE-SET,refilter-noech,PROXY # Re-filter без ECH
  - RULE-SET,refilter-ipsum,PROXY # IP Re-filter

  # --- 10. ZKEEN domains (Anton classical) → PROXY ---
  - RULE-SET,zkeen-domains,PROXY # Anton: domains.list
  - RULE-SET,zkeen-other,PROXY # Anton: other.list
  - RULE-SET,zkeen-politic,PROXY # Anton: politic.list

  # --- 11. по умолчанию ---
  - MATCH,DIRECT

