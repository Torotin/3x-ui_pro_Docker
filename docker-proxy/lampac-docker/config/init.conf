{
  "listen": {
    "version": true,
    "ip": "0.0.0.0",
    "port": 9118,
    "localhost": "127.0.0.1"
  },
  "chromium": {
    "enable": true,
    "executablePath": "/usr/bin/chromium"
  },
  "lowMemoryMode": true,
  "GC": {
    "enable": true,
    "Concurrent": true,
    "ConserveMemory": 3,
    "HighMemoryPercent": 75,
    "RetainVM": false
  },
  "serverproxy": {
    "verifyip": false
  },
  "BaseModule": {
    "SkipModules": [
      "Catalog",
      "DLNA",
      "JacRed",
      "TorrServer",
      "Tracks",
      "Transcoding",
      "CacheMedia",
      "ForkPlayerXML",
      "MsxNative",
      "Potok",
      "TelegramAuth",
      "TelegramAuthBot",
      "GStreamer"
    ]
  },
  "WAF": {
    "enable": true,
    "bypassLocalIP": true,
    "bruteForceProtection": true
  },
  "KnownProxies": [
    {
      "ip": "172.18.0.0",
      "prefixLength": 24
    },
    {
      "ip": "172.19.0.0",
      "prefixLength": 24
    },
    {
      "ip": "fd00:dead:beef:12::",
      "prefixLength": 64
    },
    {
      "ip": "fd00:dead:beef:13::",
      "prefixLength": 64
    }
  ],
  "accsdb": {
    "enable": true,
    "maxip_hour": 10,
    "maxrequest_hour": 400,
    "maxlock_day": 3,
    "blocked_hour": 36,
    "users": [
      {
        "id": "demo",
        "expires": "2099-12-31"
      },
      {
        "id": "family",
        "expires": "2099-12-31"
      }
    ],
    "whitepattern": "^/(tmdb/|nws|rch/|js/nws-client)"
  },
  "rch": {
    "enable": true,
    "autoReconnect": true,
    "requiredConnected": false
  },
  "openstat": {
    "enable": true
  },
  "online": {
    "name": "Lampac",
    "spiderName": "Lampac",
    "version": true,
    "btn_priority_forced": true,
    "limit_map": [
      {
        "pattern": "^/lite/",
        "map": {
          "limit": 20,
          "second": 1,
          "pathId": false
        }
      },
      {
        "pattern": "^/(externalids|lifeevents)",
        "map": {
          "limit": 10,
          "second": 1,
          "pathId": false
        }
      }
    ]
  },
  "sisi": {
    "lgbt": false,
    "NextHUB": true,
    "history": {
      "enable": false
    }
  },
  "globalproxy": [
    {
      "name": "usque",
      "list": [
        "socks5://usque:1080"
      ],
      "actions_attempts": 6
    },
    {
      "name": "tor",
      "pattern": "\\.onion|\\.exit|\\.tor",
      "list": [
        "socks5://tor-proxy:1080"
      ],
      "actions_attempts": 6
    }
  ],
  "tmdb": {
    "proxyapi": {
      "useproxy": true,
      "globalnameproxy": "usque",
      "proxy": {
        "list": [
          "socks5://usque:1080"
        ]
      }
    },
    "proxyimg": {
      "useproxy": true,
      "globalnameproxy": "usque",
      "proxy": {
        "list": [
          "socks5://usque:1080"
        ]
      }
    }
  },
  "cub": {
    "cache_api": -1,
    "useproxy": true,
    "globalnameproxy": "usque",
    "proxy": {
      "list": [
        "socks5://usque:1080"
      ]
    }
  },
  "LampaWeb": {
    "initPlugins": {
      "online": true,
      "sisi": true,
      "torrserver": false,
      "timecode": true,
      "jacred": false,
      "tmdbProxy": true,
      "cubProxy": true,
      "pirate_store": true,
      "dlna": false,
      "tracks": false,
      "transcoding": false,
      "sync": false,
      "bookmark": false,
      "watch_together": false,
      "catalog": false,
      "backup": false
    },
    "customPlugins": [
      {
        "url": "https://levende.github.io/lampa-plugins/profiles.js",
        "name": "Profiles Plugin",
        "description": "management in the Lampa app without requiring the CUB service",
        "status": 0
      },
      {
        "url": "https://aviamovie.github.io/surs.js",
        "name": "Surs",
        "description": "Плагин создает уникальные подборки фильмов и сериалов на главной странице по жанрам, стримингам, популярности, просмотрам и кассовым сборам.",
        "status": 1
      },
      {
        "url": "https://hub.alcopa.cc/dl/alc_auto/v2.1.44/plugin.js",
        "name": "Автопилот · Закусь",
        "description": "Одна кнопка «Смотреть»: сам собирает источники, выбирает озвучку и переключается, если источник упал.",
        "status": 1
      },
      {
        "url": "https://hub.alcopa.cc/dl/alc_trailers/v1.1.8/plugin.js",
        "name": "Трейлеры · Закусь",
        "description": "Кнопка «Трейлер» и трейлер на фоне карточки.",
        "status": 1
      },
      {
        "url": "https://hub.alcopa.cc/dl/opensubs_menu/v1.2.9/plugin.js",
        "name": "OpenSubtitles · Закусь",
        "description": "Субтитры с OpenSubtitles прямо в меню субтитров плеера.",
        "status": 1
      },
      {
        "url": "https://igorek1986.github.io/lampa-plugins/reset.js",
        "name": "Reset cache",
        "description": "Быстрый и безопасный сброс всех настроек Lampa",
        "status": 0
      }
    ]
  }
}
