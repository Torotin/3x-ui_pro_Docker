---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

title: "Server Dashboard"

description: HomeServ Homepage
background:
  image: https://images.wallpaperscraft.com/image/single/keyboard_laptop_gradient_203739_3840x2160.jpg
  blur: sm
  saturate: 50
  brightness: 50
  opacity: 50
cardBlur: xs
favicon: https://{{HOMEPAGE_VAR_WEBDOMAIN}}/favicon.ico
theme: dark
color: slate
bookmarksStyle: icons
fullWidth: true
maxGroupColumns: 8
maxBookmarkGroupColumns: 6
disableCollapse: false
groupsInitiallyCollapsed: false
useEqualHeights: true
headerStyle: boxed
base: "https://{{HOMEPAGE_VAR_WEBDOMAIN}}/{{HOMEPAGE_VAR_URI_HOMEPAGE}}"
language: en
linksInNewTab: true
target: _blank
quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
  showSearchSuggestions: true
  hideVisitURL: true
  provider: duckduckgo
hideVersion: true
disableUpdateCheck: false
logpath: /
showStats: true
statusStyle: "dot"
# instanceName: public
hideErrors: true
layout:
  Admin:
    style: row
    columns: 5
    useEqualHeights: true
  Public:
    style: row
    columns: 4
    useEqualHeights: true
  Network & Security:
    style: row
    columns: 4
    useEqualHeights: true
  Maintenance:
    style: row
    columns: 3
    useEqualHeights: true
