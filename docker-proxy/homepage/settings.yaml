---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

title: "Server Dashboard"
description: HomeServ Homepage
background:
  image: https://images.wallpaperscraft.com/image/single/keyboard_laptop_gradient_203739_3840x2160.jpg
  blur: sm
  saturate: 50
  brightness: 50
  opacity: 50
cardBlur: xs
# /favicon.ico 404s under path hosting; Homepage ships /homepage.ico.
favicon: https://{{HOMEPAGE_VAR_WEBDOMAIN}}/homepage.ico
theme: dark
color: slate
headerStyle: boxed
cardStyle: hairline
bookmarksStyle: icons
iconStyle: theme
fullWidth: true
# Side-by-side service groups (column layout). First four stay visible; optional/maintenance start collapsed.
maxGroupColumns: 4
maxBookmarkGroupColumns: 2
disableCollapse: false
groupsInitiallyCollapsed: false
useEqualHeights: false
showStats: false
statusStyle: "dot"
base: "https://{{HOMEPAGE_VAR_WEBDOMAIN}}/{{HOMEPAGE_VAR_URI_HOMEPAGE}}"
language: en
linksInNewTab: true
target: _blank
quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
  showSearchSuggestions: true
  hideVisitURL: true
  provider: duckduckgo
hideVersion: true
disableUpdateCheck: true
hideErrors: true
logpath: /
# Array form locks visual group order. style: columns = vertical stack per group.
layout:
  - Control Plane:
      icon: mdi-view-dashboard-variant
      style: columns
  - Edge & Apps:
      icon: mdi-web
      style: columns
  - Security:
      icon: mdi-shield-check
      style: columns
  - Proxies:
      icon: mdi-lan
      style: columns
  - Optional Features:
      icon: mdi-puzzle-outline
      style: columns
      initiallyCollapsed: true
  - Maintenance:
      icon: mdi-wrench-outline
      style: columns
      initiallyCollapsed: true
  - Upstream:
      icon: mdi-github
      style: columns
  - Docs:
      icon: mdi-book-open-page-variant
      style: columns
