- Control Plane:
    - 3X-UI Web Panel:
        icon: https://github.com/MHSanaei/3x-ui/raw/main/media/3x-ui-dark.png
        href: "https://{{HOMEPAGE_VAR_WEBDOMAIN}}/{{HOMEPAGE_VAR_URI_3X-UI_PATH}}/"
        description: Xray and subscription control panel
        server: dockerproxy
        container: 3x-ui

    - Traefik Dashboard:
        icon: sh-traefik.webp
        href: "https://{{HOMEPAGE_VAR_WEBDOMAIN}}/{{HOMEPAGE_VAR_URI_TRAEFIK_DASHBOARD}}/dashboard/#/"
        description: Edge routing and middleware status
        server: dockerproxy
        container: traefik
        widget:
            type: traefik
            url: "https://{{HOMEPAGE_VAR_WEBDOMAIN}}:4443/{{HOMEPAGE_VAR_URI_TRAEFIK_DASHBOARD}}"
            username: "{{HOMEPAGE_VAR_USER_WEB}}"
            password: "{{HOMEPAGE_VAR_PASS_WEB}}"

    - AdGuard Home:
        icon: sh-adguard-home.webp
        href: "https://{{HOMEPAGE_VAR_WEBDOMAIN}}/{{HOMEPAGE_VAR_URI_ADGUARD_PANEL}}/"
        description: DNS filtering and DoH endpoint
        server: dockerproxy
        container: adguard
        siteMonitor: http://adguard/
        widget:
            type: adguard
            url: http://adguard
            username: "{{HOMEPAGE_VAR_USER_WEB}}"
            password: "{{HOMEPAGE_VAR_PASS_WEB}}"

    - Dozzle:
        icon: sh-dozzle.webp
        href: "https://{{HOMEPAGE_VAR_WEBDOMAIN}}/{{HOMEPAGE_VAR_URI_DOZZLE}}/"
        description: Container log viewer
        server: dockerproxy
        container: dozzle

- Edge & Apps:
    - Homepage Dashboard:
        icon: mdi-view-dashboard
        href: "https://{{HOMEPAGE_VAR_WEBDOMAIN}}/{{HOMEPAGE_VAR_URI_HOMEPAGE}}/"
        description: This dashboard
        server: dockerproxy
        container: homepage

    - Public Root:
        icon: mdi-home
        href: "https://{{HOMEPAGE_VAR_WEBDOMAIN}}"
        description: Public root (Caddy fallback, or Lampac when enabled)
        siteMonitor: "https://{{HOMEPAGE_VAR_WEBDOMAIN}}:4443"

    - Caddy Fallback:
        icon: sh-caddy.webp
        description: Internal fallback and error backend
        server: dockerproxy
        container: caddy

    - Sub JSON Processor:
        icon: mdi-file-code
        description: JSON subscription geodata post-processor
        server: dockerproxy
        container: sub-json-processor
        siteMonitor: http://sub-json-processor:8080/healthz

- Security:
    - CrowdSec:
        icon: mdi-shield-half-full
        description: LAPI, AppSec, and security decisions
        server: dockerproxy
        container: crowdsec

    - CrowdSec Firewall Bouncer:
        icon: mdi-firewall
        description: Host firewall decisions from CrowdSec
        server: dockerproxy
        container: crowdsec_firewall_bouncer

- Proxies:
    - Usque:
        icon: mdi-transit-connection-variant
        description: Cloudflare WARP SOCKS backend
        server: dockerproxy
        container: usque

    - TOR Proxy:
        icon: mdi-security-network
        description: Internal TOR SOCKS backend
        server: dockerproxy
        container: tor-proxy

- Optional Features:
    - Telemt Panel:
        icon: mdi-telegram
        href: "https://{{HOMEPAGE_VAR_WEBDOMAIN}}/{{HOMEPAGE_VAR_URI_TELEMT_PANEL}}/"
        description: "Optional (ENABLE_TELEMT) · MTProxy / Telemt control panel"
        server: dockerproxy
        container: telemt

    - Lampac:
        icon: mdi-television-classic
        href: "https://{{HOMEPAGE_VAR_WEBDOMAIN}}/"
        description: "Optional (ENABLE_LAMPAC) · Media aggregator frontend"
        server: dockerproxy
        container: lampac

    - Mihomo:
        icon: mdi-router-network
        href: "https://{{HOMEPAGE_VAR_WEBDOMAIN}}/{{HOMEPAGE_VAR_URI_MIHOMO}}/ui/"
        description: "Optional (ENABLE_MIHOMO) · secret: {{HOMEPAGE_VAR_MIHOMO_SECRET}}"
        server: dockerproxy
        container: mihomo

- Maintenance:
    - Logrotate:
        icon: mdi-file-rotate-right
        description: Container log rotation
        server: dockerproxy
        container: logrotate

    - Traefik ACME Exporter:
        icon: mdi-certificate
        description: Certificate export worker
        server: dockerproxy
        container: traefik-acme-exporter
