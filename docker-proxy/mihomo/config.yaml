mode: rule
log-level: info
ipv6: true
find-process-mode: strict
mixed-port: 7890
secret: MyStrongSecret123
bind-address: "*"
tcp-concurrent: true
unified-delay: true
external-ui: /zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
profile:
  store-selected: true
  store-fake-ip: true
external-controller: 0.0.0.0:9090
external-controller-cors:
  allow-private-network: true

dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "*.docker"
    - "*.internal"
  default-nameserver:
    - 9.9.9.9
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://1.1.1.1/dns-query
    - https://1.0.0.1/dns-query
    - https://dns.quad9.net/dns-query
  fallback:
    - https://8.8.8.8/dns-query
    - https://8.8.4.4/dns-query
  fallback-filter:
  geoip: false
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
  hosts:
    'domain:appcenter.ms': 127.0.0.1
    'domain:firebase.io': 127.0.0.1
    'domain:mixpanel.com': 127.0.0.1
    'domain:scorecardresearch.com': 127.0.0.1
    'domain:quantserve.com': 127.0.0.1
    'domain:adj.st': 127.0.0.1
    'domain:app.adjust.com': 127.0.0.1
    'domain:app.link': 127.0.0.1
    'domain:appsflyer.com': 127.0.0.1
    'domain:adservice.google.com': 127.0.0.1
    'domain:googleadservices.com': 127.0.0.1

    'googleapis.cn': 'googleapis.com'

    'dns.alidns.com':
      - 223.5.5.5
      - 223.6.6.6

    'one.one.one.one':
      - 1.1.1.1
      - 1.0.0.1

    'dns.cloudflare.com':
      - 104.16.132.229
      - 104.16.133.229

    'cloudflare-dns.com':
      - 104.16.248.249
      - 104.16.249.249

