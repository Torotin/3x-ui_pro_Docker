proxy-providers:
  nodes:
    type: file
    path: ./proxy-providers/local/proxies.yaml
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 1800

  provider1:
    type: http
    url: "https://example.com/sub1"
    path: ./proxy-providers/subs/provider1.yaml
    interval: 3600
    lazy: true
    health-check:
      enable: true
      interval: 600
      url: https://cp.cloudflare.com/generate_204

  provider2:
    type: http
    url: "https://example.com/sub2"
    path: ./proxy-providers/subs/provider2.yaml
    interval: 3600
    lazy: true
    health-check:
      enable: true
      interval: 600
      url: https://cp.cloudflare.com/generate_204

  provider3:
    type: http
    url: "https://example.com/sub3"
    path: ./proxy-providers/subs/provider3.yaml
    interval: 3600
    lazy: true
    health-check:
      enable: true
      interval: 600
      url: https://cp.cloudflare.com/generate_204

proxy-groups:
  # Автовыбор лучшего узла по latency
  # url-test периодически проверяет задержку до узлов из списка и выбирает лучший
  - name: AUTO
    type: url-test
    use:
      - nodes
      - provider1
      - provider2
      - provider3

    url: https://cp.cloudflare.com/generate_204
    interval: 1800
    tolerance: 50
    lazy: true
    timeout: 5000

  # Главная группа обхода блокировок
  # Большинство сервисов используют именно её
  # Остальные selector-группы имеют приоритет поверх неё
  - name: Заблок. сервисы
    type: select
    use:
      - provider1
      - provider2
      - provider3

    proxies:
      - AUTO

  - name: YouTube
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png
    include-all: true
    proxies: [Заблок. сервисы, DIRECT]

  - name: Discord
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Discord.png
    include-all: true
    proxies: [Заблок. сервисы, DIRECT]

  - name: Twitch
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Twitch.png
    include-all: true
    proxies: [DIRECT, Заблок. сервисы]

  - name: Reddit
    type: select
    icon: https://www.redditstatic.com/shreddit/assets/favicon/192x192.png
    include-all: true
    proxies: [DIRECT, Заблок. сервисы]

  - name: Meta
    type: select
    icon: https://github.com/zxc-rv/assets/raw/main/group-icons/meta.png
    include-all: true
    proxies: [Заблок. сервисы, DIRECT]

  - name: Spotify
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Spotify.png
    include-all: true
    exclude-filter: 🇷🇺
    proxies: [Заблок. сервисы, DIRECT]

  - name: Speedtest
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Speedtest.png
    include-all: true
    proxies: [Заблок. сервисы, DIRECT]

  - name: Telegram
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png
    include-all: true
    proxies: [Заблок. сервисы, DIRECT]

  - name: Steam
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Steam.png
    include-all: true
    proxies: [DIRECT, Заблок. сервисы]

  # CDN трафик можно отправлять отдельно
  # Полезно если некоторые CDN режутся провайдером
  # PASS = обход без прокси
  - name: CDN
    type: select
    icon: https://www.svgrepo.com/show/396567/globe-with-meridians.svg
    include-all: true
    proxies: [Заблок. сервисы, PASS]

  - name: Google
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png
    include-all: true
    proxies: [PASS, Заблок. сервисы]

  - name: GitHub
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/GitHub.png
    include-all: true
    proxies: [PASS, Заблок. сервисы]

  # OpenAI/Claude/Gemini и прочие AI сервисы
  # exclude-filter исключает RU-ноды
  - name: AI
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Bot.png
    include-all: true
    exclude-filter: 🇷🇺
    proxies: [Заблок. сервисы]

  - name: Twitter
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Twitter.png
    include-all: true
    proxies: [Заблок. сервисы, DIRECT]

  - name: TikTok
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/TikTok.png
    include-all: true
    proxies: [Заблок. сервисы, DIRECT]

