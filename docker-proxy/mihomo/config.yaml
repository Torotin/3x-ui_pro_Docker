allow-lan: true
# bind-address: "*"
# lan-allowed-ips:
# - 0.0.0.0/0
# - ::/0
# lan-disallowed-ips:
# - 192.168.0.3/32
# authentication: #для прокси http(s)/socks/mixed
# - "user1:pass1"
# - "user2:pass2"
# skip-auth-prefixes: #разрешено пропускать аутентификацию
# - 127.0.0.1/8
# - ::1/128
mode: rule
log-level: info
ipv6: true
find-process-mode: strict
mixed-port: 7890
secret: ${MIHOMO_SECRET}
bind-address: "*"
tcp-concurrent: true
unified-delay: true
external-ui: zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
profile:
  store-selected: true
  store-fake-ip: true
external-controller: 0.0.0.0:9090
external-controller-cors:
  allow-private-network: true

anchors:
  a1: &domain { type: http, format: mrs, behavior: domain, interval: 86400 }
  a2: &ipcidr { type: http, format: mrs, behavior: ipcidr, interval: 86400 }
  a3: &classical { type: http, format: text, behavior: classical, interval: 86400 }
  a4: &inline { type: inline, behavior: classical }

dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "*.docker"
    - "*.internal"
  default-nameserver:
    - 9.9.9.9
    - 149.112.112.112
    - 1.0.0.1
    - 1.1.1.1
  nameserver:
    - https://dns.quad9.net/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback:
    - tls://dns.quad9.net
    - tls://1dot1dot1dot1.cloudflare-dns.com

  fallback-filter:
  geoip: false
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
  hosts:
