proxy-providers:
  nodes:
    type: file
    path: ./proxy-providers/local/proxies.yaml
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 1800

  provider1:
    type: http
    url: "https://example.com/sub1"
    path: ./proxy-providers/subs/provider1.yaml
    interval: 3600
    lazy: true
    health-check:
      enable: true
      interval: 600
      url: https://cp.cloudflare.com/generate_204

  provider2:
    type: http
    url: "https://example.com/sub2"
    path: ./proxy-providers/subs/provider2.yaml
    interval: 3600
    lazy: true
    health-check:
      enable: true
      interval: 600
      url: https://cp.cloudflare.com/generate_204

  provider3:
    type: http
    url: "https://example.com/sub3"
    path: ./proxy-providers/subs/provider3.yaml
    interval: 3600
    lazy: true
    health-check:
      enable: true
      interval: 600
      url: https://cp.cloudflare.com/generate_204

proxy-groups:
  - name: MANUAL
    type: select

    use:
      - nodes
      - provider1
      - provider2
      - provider3

  - name: AUTO
    type: url-test

    use:
      - nodes
      - provider1
      - provider2
      - provider3

    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

  - name: INTERNET
    type: select
    proxies:
      - AUTO
      - MANUAL
      - DIRECT

rules:
  - MATCH,INTERNET