rules:
  - RULE-SET,adlist@domain,REJECT # Блокировка рекламы
  - RULE-SET,quic@inline,REJECT # QUIC блокируется чтобы принудить HTTP/2 TCP. Иначе часть трафика может обходить transparent proxy

  - RULE-SET,category-bank-ru@domain,DIRECT
  - RULE-SET,category-betting-ru@domain,DIRECT
  - RULE-SET,category-ecommerce-ru@domain,DIRECT
  - RULE-SET,category-entertainment-ru@domain,DIRECT
  - RULE-SET,category-gov-ru@domain,DIRECT
  - RULE-SET,category-media-ru@domain,DIRECT
  - RULE-SET,category-medicine-ru@domain,DIRECT
  - RULE-SET,category-retail-ru@domain,DIRECT
  - RULE-SET,category-ru@domain,DIRECT
  - RULE-SET,category-travel-ru@domain,DIRECT
  - RULE-SET,genotek-ru@domain,DIRECT
  - RULE-SET,ideco-ru@domain,DIRECT
  - RULE-SET,myoffice-ru@domain,DIRECT
  - RULE-SET,tbank-ru@domain,DIRECT
  - RULE-SET,private@domain,DIRECT
  - RULE-SET,yandex@domain,DIRECT
  - RULE-SET,steam@domain,DIRECT
  - RULE-SET,vk@domain,DIRECT
  - RULE-SET,ru-tlds@classical,DIRECT

  - OR,((DOMAIN-SUFFIX,gql.twitch.tv),(DOMAIN-SUFFIX,usher.ttvnw.net)),Заблок. сервисы # Разблокировка высокого качества на Twitch.tv (может вызвать рекламу)
  - RULE-SET,category-ai@domain,AI
  - RULE-SET,steam@domain,Steam
  - RULE-SET,spotify@domain,Spotify
  - RULE-SET,reddit@domain,Reddit
  - RULE-SET,youtube@domain,YouTube
  - RULE-SET,twitch@domain,Twitch
  - RULE-SET,twitter@domain,Twitter
  - RULE-SET,tiktok@domain,TikTok
  - RULE-SET,discord@classical,Discord
  - RULE-SET,speedtest@domain,Speedtest # Для корректного замера нужно добавить порт 8080 через xkeen -ap или в /opt/etc/xkeen/port_proxying.lst
  - OR,((RULE-SET,meta@domain),(RULE-SET,meta@ipcidr,no-resolve)),Meta
  - OR,((RULE-SET,telegram@domain),(RULE-SET,telegram@ipcidr,no-resolve)),Telegram
  - OR,((RULE-SET,refilter@domain),(RULE-SET,user@classical)),Заблок. сервисы
  - OR,((RULE-SET,roblox@domain),(RULE-SET,AS22697@ipcidr)),Заблок. сервисы
  - RULE-SET,github@domain,GitHub
