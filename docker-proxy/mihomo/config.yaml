    'domain:quantserve.com': 127.0.0.1
    'domain:adj.st': 127.0.0.1
    'domain:app.adjust.com': 127.0.0.1
    'domain:app.link': 127.0.0.1
    'domain:appsflyer.com': 127.0.0.1
    'domain:adservice.google.com': 127.0.0.1
    'domain:googleadservices.com': 127.0.0.1

    'googleapis.cn': 'googleapis.com'

    'dns.alidns.com':
      - 223.5.5.5
      - 223.6.6.6

    'one.one.one.one':
      - 1.1.1.1
      - 1.0.0.1

    'dns.cloudflare.com':
      - 104.16.132.229
      - 104.16.133.229

    'cloudflare-dns.com':
      - 104.16.248.249
      - 104.16.249.249

